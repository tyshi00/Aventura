name: Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit hash, not a tag. A tag such as v4 is a label its
      # owner can move, so the same line of YAML could run different code next time. A hash cannot move.
      # To update one: look up the commit behind the new release tag, replace the hash, and update the comment.
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Aventura release APK
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :aventura:assembleRelease --no-daemon

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find aventura/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK was produced" >&2
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # GitHub's own command line tool, already on the runner, so no third-party code touches the APK.
      # Only runs for a pushed tag. A manual run (Run workflow button) builds the APK to test the
      # pipeline, but does not publish anything.
      - name: Create the release and attach the APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.find_apk.outputs.apk_path }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" --generate-notes --verify-tag
          fi
